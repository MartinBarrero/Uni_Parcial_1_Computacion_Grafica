<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Punto1Parcial</title>

    <style>
      body {
        background-color: rgb(255, 244, 233);
        margin: 0;
        padding: 50px;
      }
      .contenedor {
        background-color: #fff9f0;
        width: 680px;
        min-height: 680px;
        padding: 30px;
        margin: 30px auto;
        border-radius: 5px;
      }
      .barra-superior {
        background-color: #cdb4db;
        width: 100%;
        height: 45px;
        border-radius: 3px;
      }
      .primera-fila {
        display: grid;
        grid-template-columns: 210px 210px 210px;
        column-gap: 25px;
        margin-top: 25px;
      }
      .cuadrado {
        aspect-ratio: 1/1;
        border-radius: 3px;
      }
      .rosado {
        background-color: #f4b6c2;
        height: 208px;
        width: 208px;
        aspect-ratio: auto;
      }
      .verde {
        background-color: #b8e0d2;
      }
      .rombo {
        width: 120px;
        height: 120px;
        background-color: #cdb4db;
        transform: rotate(45deg);
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .rombo-contenedor {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .rombo-pequeño {
        width: 90px;
        height: 90px;
        background-color: #ffd1b3;
      }
      .segunda-fila {
        display: grid;
        grid-template-columns: 210px 210px 210px;
        column-gap: 25px;
        margin-top: 25px;
      }
      .cuadrado-amarillo {
        background-color: #ffe5a3;
        aspect-ratio: 1/1;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .cuadrado-intermedio {
        background-color: #fff9f0;
        aspect-ratio: 1/1;
        width: 70%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .cuadrado-interno {
        background-color: #f4b6c2;
        aspect-ratio: 1/1;
        width: 70%;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .espacio-circulo {
        display: flex;
        justify-content: center;
        align-items: flex-start;
      }
      .circulo {
        width: 90%;
        aspect-ratio: 1/1;
        border-radius: 50%;
      }
      .morado {
        background-color: #cdb4db;
        width: 95%;
      }
      .durazno {
        background-color: #ffd1b3;
        width: 85%;
      }
      .tercera-fila {
        display: grid;
        grid-template-columns: 210px 210px 210px;
        column-gap: 25px;
        margin-top: 25px;
        align-items: start;
      }
      .grupo-barras {
        display: flex;
        flex-direction: column;
        gap: 18px;
        margin-top: 0px;
      }
      .barra-grande {
        height: 95px;
        background-color: #ffd1b3;
        border-radius: 3px;
      }
      .barra-pequeña {
        height: 30px;
        background-color: #ffd1b3;
        border-radius: 3px;
      }
      .barra-rosada {
        height: 30px;
        background-color: #f4b6c2;
        border-radius: 3px;
      }
      .cuadrado-turquesa {
        background-color: #62b6b7;
        height: 190px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: 0px;
      }
      .intermedio-turquesa {
        width: 70%;
        height: 70%;
        aspect-ratio: auto;
        background-color: #fff9f0;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .cuadrado-derecho {
        aspect-ratio: 1/1;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-top: -20px;
      }

      .cuadrado-centro-turquesa {
        width: 70%;
        height: 62%;
        background-color: #3b9d9d;
      }
      .cuadrado-centro-verde {
        width: 65%;
        height: 65%;
        background-color: #70b89b;
      }
      .primera-fila > :first-child,
      .segunda-fila > :first-child,
      .tercera-fila > :first-child {
        width: 195px;
      }
    </style>
  </head>
  <body>
    <div class="contenedor">
      <div class="barra-superior"></div>
      <div class="primera-fila">
        <div class="cuadrado rosado"></div>
        <div class="cuadrado verde rombo-contenedor">
          <div class="rombo">
            <div class="rombo-pequeño"></div>
          </div>
        </div>
        <div class="cuadrado verde"></div>
      </div>
      <div class="segunda-fila">
        <div class="cuadrado-amarillo">
          <div class="cuadrado-intermedio">
            <div class="cuadrado-interno"></div>
          </div>
        </div>
        <div class="espacio-circulo">
          <div class="circulo morado"></div>
        </div>
        <div class="espacio-circulo">
          <div class="circulo durazno"></div>
        </div>
      </div>
      <div class="tercera-fila">
        <div class="grupo-barras">
          <div class="barra-grande"></div>
          <div class="barra-pequeña"></div>
          <div class="barra-rosada"></div>
          <div class="barra-rosada"></div>
        </div>
        <div class="cuadrado-turquesa">
          <div class="cuadrado-intermedio intermedio-turquesa">
            <div class="cuadrado-centro-turquesa"></div>
          </div>
        </div>
        <div class="cuadrado verde cuadrado-derecho">
          <div class="cuadrado-intermedio">
            <div class="cuadrado-centro-verde"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
